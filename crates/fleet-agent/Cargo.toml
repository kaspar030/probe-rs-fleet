[package]
name = "fleet-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent role implementation for probe-rs-fleet."

[features]
default = ["gpio"]
# Linux gpiod char-device power control. Off by default-builds on non-Linux dev
# hosts so the crate still compiles/tests; the `gpio` PowerKind then yields an
# `Unsupported` error at runtime.
gpio = ["dep:tokio-gpiod"]

[dependencies]
fleet-proto.workspace = true
fleet-tls.workspace = true
fleet-wire = { workspace = true, features = ["tungstenite"] }

postcard.workspace = true
postcard-rpc.workspace = true
serde.workspace = true

tokio.workspace = true
async-trait.workspace = true

toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

ed25519-dalek.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tokio-gpiod = { workspace = true, optional = true }

[dev-dependencies]
rand_core.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
fleet-wire = { workspace = true, features = ["tungstenite", "test-util"] }

[lints]
workspace = true
