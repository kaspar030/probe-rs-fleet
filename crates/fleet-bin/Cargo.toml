[package]
name = "fleet-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single multi-role binary for probe-rs-fleet (coordinator, agent, sidecar, ctl)."

[[bin]]
name = "probe-rs-fleet"
path = "src/main.rs"

[dependencies]
fleet-proto = { workspace = true }
fleet-core = { workspace = true }
fleet-tls = { workspace = true }
forgs.workspace = true
forgs-client.workspace = true
# The shell-on-the-host admin verbs mint through forgs directly.
forgs-store.workspace = true
forgs-http.workspace = true
fleet-wire = { workspace = true, features = ["tungstenite"] }
fleet-agent = { workspace = true }
fleet-coordinator = { workspace = true }
fleet-sidecar = { workspace = true }

clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
directories = { workspace = true }
sha2 = { workspace = true }
rand_core = { workspace = true, features = ["getrandom"] }
# `api_client`'s GET for the coordinator's own JSON routes, over the same
# connector and trust config as forgs-client.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls.workspace = true
http-body-util.workspace = true
http.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
# `node_board`'s tests need their own `ProbeLister` stub: fleet-agent's is
# `#[cfg(test)]`-private, so it cannot be borrowed across the crate boundary.
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
fleet-coordinator = { workspace = true }
fleet-wire = { workspace = true, features = ["tungstenite", "test-util"] }
fleet-core = { workspace = true }
axum = { workspace = true }
# `ci_e2e.rs` stands up a stub GitHub Actions token service, which has to sign
# a real RS256 JWT for the coordinator to verify.
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
# The approve e2e reads forgs' pending-registration table for the code a human
# would read off the node's terminal.
sqlx = { workspace = true }

[lints]
workspace = true
