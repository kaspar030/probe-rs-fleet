[package]
name = "fleet-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single multi-role binary for probe-rs-fleet (coordinator, agent, sidecar, ctl)."

[[bin]]
name = "probe-rs-fleet"
path = "src/main.rs"

[dependencies]
fleet-proto = { workspace = true }
fleet-core = { workspace = true }
fleet-tls = { workspace = true }
fleet-auth = { workspace = true, features = ["client"] }
fleet-wire = { workspace = true, features = ["tungstenite"] }
fleet-agent = { workspace = true }
fleet-coordinator = { workspace = true }
fleet-sidecar = { workspace = true }

clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
directories = { workspace = true }
sha2 = { workspace = true }
rand_core = { workspace = true, features = ["getrandom"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
fleet-coordinator = { workspace = true }
fleet-wire = { workspace = true, features = ["tungstenite", "test-util"] }
fleet-core = { workspace = true }
axum = { workspace = true }

[lints]
workspace = true
