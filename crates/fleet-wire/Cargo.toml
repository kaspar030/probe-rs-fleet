[package]
name = "fleet-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = false
include = ["src/**", "Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE"]
description = "WebSocket framing + control-plane envelopes for probe-rs-fleet."

[dependencies]
fleet-proto.workspace = true

serde.workspace = true
postcard.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync"] }

# The dial-out client half. Off by default so a crate that only needs the
# envelopes (or only the axum adapter, which lives in fleet-coordinator) does
# not link a WebSocket client.
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
http = { workspace = true, optional = true }
fleet-tls = { workspace = true, optional = true }

[features]
default = []
tungstenite = [
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:http",
    "dep:fleet-tls",
    "tokio/net",
]
# Expose the in-memory WireTx/WireRx pair to other crates' tests.
test-util = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
