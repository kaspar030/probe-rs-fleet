[package]
name = "fleet-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bearer-token minting, verification and rotation policy for probe-rs-fleet."

[dependencies]
fleet-proto.workspace = true

serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true

# `client` feature: the HTTP egress used by `agent init` / `ctl` to call
# `POST /auth/token`. Off by default so the crate stays pure for the
# coordinator, which only ever verifies.
hyper = { workspace = true, optional = true, features = ["client", "http1"] }
hyper-util = { workspace = true, optional = true, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
http = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
fleet-tls = { workspace = true, optional = true }

[features]
default = []
client = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:http-body-util",
    "dep:http",
    "dep:rustls",
    "dep:tokio",
    "dep:fleet-tls",
]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
