[package]
name = "fleet-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bearer-token minting, verification and rotation policy for probe-rs-fleet."

[dependencies]
fleet-proto.workspace = true

serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true

# `client` feature: the HTTP egress used by `share` / `agent up` / `ctl` to call
# `POST /auth/token`. Off by default so the crate stays pure for the
# coordinator, which only ever verifies.
hyper = { workspace = true, optional = true, features = ["client", "http1"] }
hyper-util = { workspace = true, optional = true, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
http = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
fleet-tls = { workspace = true, optional = true }

# `oidc` feature: GitHub Actions workload-identity JWT verification
# (architecture §6.7). Off by default and enabled only by `fleet-coordinator`,
# which is the only crate that verifies one. `jsonwebtoken/rust_crypto` drags
# in `rsa`, `p256`, `p384`, `ed25519-dalek` and `num-bigint-dig`, and this
# crate's other consumer path ends in the Raspberry Pi binary — so the flag
# keeps `docs/cross-compiling.md`'s verified-crates table meaningful.
jsonwebtoken = { workspace = true, optional = true }

[features]
default = []
client = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:http-body-util",
    "dep:http",
    "dep:rustls",
    "dep:tokio",
    "dep:fleet-tls",
]
# The pure verifier. `JwksCache` additionally needs `client` for its HTTPS
# egress, and is `#[cfg]`-gated on it inside the module.
oidc = ["dep:jsonwebtoken"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
