[package]
name = "probefleet-sidecar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = false
include = ["src/**", "Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE"]
description = "Sidecar role implementation for probefleet."

[dependencies]
probefleet-proto = { workspace = true }
probefleet-tls = { workspace = true }
probefleet-wire = { workspace = true, features = ["tungstenite"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
probefleet-agent = { workspace = true }
probefleet-wire = { workspace = true, features = ["tungstenite", "test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
