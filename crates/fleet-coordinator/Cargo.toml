[package]
name = "fleet-coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Coordinator role implementation for probe-rs-fleet."

[dependencies]
fleet-proto.workspace = true
fleet-core.workspace = true
fleet-tls.workspace = true
fleet-wire.workspace = true
fleet-auth = { workspace = true, features = ["client"] }

tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true

# HTTP/WebSocket server. This is the *only* crate in the workspace that depends
# on axum/hyper's server half; fleet-agent and fleet-sidecar dial out with
# tokio-tungstenite through fleet-wire. See
# `crates/fleet-agent/tests/no_http_server_dep.rs`.
axum.workspace = true
hyper-util = { workspace = true, features = ["server", "server-auto", "http1", "tokio"] }
tower.workspace = true
futures-util.workspace = true

postcard.workspace = true
serde.workspace = true
serde_json.workspace = true

sqlx.workspace = true

sha2.workspace = true

ed25519-dalek.workspace = true

async-trait.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
fleet-agent.workspace = true
fleet-sidecar.workspace = true
fleet-wire = { workspace = true, features = ["tungstenite", "test-util"] }
tokio-tungstenite.workspace = true
async-trait.workspace = true
fleet-tls.workspace = true
fleet-core.workspace = true
rcgen.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
http-body-util.workspace = true

[lints]
workspace = true
