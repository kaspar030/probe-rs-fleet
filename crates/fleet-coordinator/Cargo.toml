[package]
name = "fleet-coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = false
# Package contents for crates.io: sources plus the assets embedded at compile
# time (web UI, migrations) — no tests, fixtures or scratch dirs.
include = ["src/**", "Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE", "build.rs", "migrations/**", "web/**"]
description = "Coordinator role implementation for probe-rs-fleet."

[dependencies]
fleet-proto.workspace = true
fleet-core.workspace = true
fleet-tls.workspace = true
fleet-wire.workspace = true
# Identity, sessions, API keys, the device flow and browser login are forgs'.
# `oidc` + `client` on forgs-idp is what makes this the only crate that
# verifies a JWT (architecture §6.7); the agent never links these.
forgs.workspace = true
forgs-store.workspace = true
forgs-http.workspace = true
forgs-idp = { workspace = true, features = ["client", "oidc"] }

tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true

# HTTP/WebSocket server. This is the *only* crate in the workspace that depends
# on axum/hyper's server half; fleet-agent and fleet-sidecar dial out with
# tokio-tungstenite through fleet-wire. See
# `crates/fleet-agent/tests/no_http_server_dep.rs`.
axum.workspace = true
hyper-util = { workspace = true, features = ["server", "server-auto", "http1", "tokio"] }
tower.workspace = true
futures-util.workspace = true

postcard.workspace = true
serde.workspace = true
serde_json.workspace = true

sqlx.workspace = true

sha2.workspace = true
# The CSRF double-submit token is `HMAC-SHA256` over the session token hash,
# keyed by a derivation of the coordinator's existing ed25519 signing seed
# (docs/web-ui.md D1) — no cookie framework, no second secret to persist.
# `subtle` gives the constant-time comparison that check needs; both are pure
# Rust and already in the lock file, so `docs/cross-compiling.md`'s `ring`-only,
# no-C-toolchain constraint is unaffected.
hmac.workspace = true
subtle.workspace = true
base64.workspace = true

# The web UI's asset tree, embedded at compile time (docs/web-ui.md D3); see
# `src/assets.rs` for the serving side and for why there is no build step.
include_dir.workspace = true

ed25519-dalek.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }

async-trait.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
fleet-agent.workspace = true
fleet-sidecar.workspace = true
fleet-wire = { workspace = true, features = ["tungstenite", "test-util"] }
tokio-tungstenite.workspace = true
async-trait.workspace = true
fleet-tls.workspace = true
fleet-core.workspace = true
rcgen.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
http-body-util.workspace = true
# The workload-OIDC integration tests sign their own fixtures, exactly as a
# stub issuer would.
jsonwebtoken.workspace = true
base64.workspace = true

[lints]
workspace = true
