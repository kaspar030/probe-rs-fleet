[workspace]
resolver = "2"
members = [
    "crates/fleet-proto",
    "crates/fleet-core",
    "crates/fleet-tls",
    "crates/fleet-agent",
    "crates/fleet-coordinator",
    "crates/fleet-sidecar",
    "crates/fleet-bin",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }


[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ariel-os/probe-rs-fleet"

[workspace.dependencies]
# internal
fleet-proto = { path = "crates/fleet-proto" }
fleet-core = { path = "crates/fleet-core" }
fleet-tls = { path = "crates/fleet-tls" }
fleet-agent = { path = "crates/fleet-agent" }
fleet-coordinator = { path = "crates/fleet-coordinator" }
fleet-sidecar = { path = "crates/fleet-sidecar" }

# rpc / wire
postcard-rpc = { version = "0.12", features = ["use-std"] }
postcard = { version = "1", features = ["use-std"] }
postcard-schema = "0.2"
serde = { version = "1", features = ["derive"] }

# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal"] }

# tls
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = { version = "0.13", features = ["x509-parser"] }

# storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# cli / config / errors / logging
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
directories = "6"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# crypto (capability tokens)
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"

# async traits (object-safe dyn impls)
async-trait = "0.1"

# gpio (Linux char-device line control; agent power control)
tokio-gpiod = "0.3"

# dev / test helpers
tempfile = "3"
