[workspace]
resolver = "2"
members = [
    "crates/fleet-proto",
    "crates/fleet-core",
    "crates/fleet-tls",
    "crates/fleet-wire",
    "crates/fleet-agent",
    "crates/fleet-coordinator",
    "crates/fleet-sidecar",
    "crates/fleet-bin",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }


[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ariel-os/probe-rs-fleet"

[workspace.dependencies]
# internal
fleet-proto = { path = "crates/fleet-proto" }
fleet-core = { path = "crates/fleet-core" }
fleet-tls = { path = "crates/fleet-tls" }

# identity / auth (forgs). Path deps into the sibling forgs checkout; in a
# task worktree `../forgs` is a symlink to it.
forgs = { path = "../forgs/crates/forgs" }
forgs-store = { path = "../forgs/crates/forgs-store" }
forgs-http = { path = "../forgs/crates/forgs-http" }
forgs-idp = { path = "../forgs/crates/forgs-idp" }
forgs-client = { path = "../forgs/crates/forgs-client" }
fleet-wire = { path = "crates/fleet-wire" }
fleet-agent = { path = "crates/fleet-agent" }
fleet-coordinator = { path = "crates/fleet-coordinator" }
fleet-sidecar = { path = "crates/fleet-sidecar" }

# rpc / wire
postcard-rpc = { version = "0.12", features = ["use-std"] }
postcard = { version = "1", features = ["use-std"] }
postcard-schema = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
base64 = "0.22"

# http / websocket transport (architecture §3.5).
#
# Everything below is pinned to `default-features = false` and the rustls `ring`
# provider for the same reason the TLS block below says: the agent must
# cross-compile to armv7-musl, and `aws-lc-rs` does not. `docs/cross-compiling.md`
# records the verification.
#
# Layering: `axum`/`hyper`'s *server* half is a coordinator-only dependency.
# `fleet-agent` / `fleet-sidecar` pull only `tokio-tungstenite` (through
# `fleet-wire`'s `tungstenite` feature) — see
# `crates/fleet-agent/tests/no_http_server_dep.rs`.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json"] }
# Pinned to the major axum 0.8 depends on. A newer tokio-tungstenite compiles
# fine but ships a SECOND copy of tungstenite on every Raspberry Pi, since
# `fleet-bin` links both the coordinator (axum's copy) and the dialer (ours).
# Bump this together with axum.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
http-body-util = { version = "0.1", default-features = false }
http = { version = "1", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tower = { version = "0.5", default-features = false }
webpki-roots = { version = "1", default-features = false }

# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal"] }

# tls — use the pure-Rust `ring` crypto provider (not aws-lc-rs) so the agent
# cross-compiles cleanly to ARM/musl targets (Raspberry Pi). aws-lc-rs pulls in
# a C crypto build that fails to cross-compile to armv7-musl.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
# Test-only since revision 2: the private CA is gone, so nothing in the shipping
# binary mints a certificate. It survives as a dev-dependency for the tests that
# need a self-signed server cert (fleet-tls's trust tests, the coordinator's
# self-hosted-TLS test).
rcgen = { version = "0.13", default-features = false, features = ["x509-parser", "ring", "pem"] }
sha2 = "0.10"
# Cookie/CSRF machinery for the browser surface (docs/web-ui.md D1). Pure Rust,
# no C toolchain: `docs/cross-compiling.md`'s constraint applies to every new
# dependency, and these two were already in the lock file transitively.
hmac = "0.12"
subtle = "2"

# The web UI's asset tree, embedded in the binary (docs/web-ui.md D3). A proc
# macro that expands to `include_bytes!` per file: pure Rust, no C toolchain, no
# build step, nothing generated — which is what keeps `cargo build` working on a
# machine with no node/npm installed, structurally rather than as a fallback.
include_dir = "0.7"

# storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# cli / config / errors / logging
clap = { version = "4", features = ["derive", "env"] }
# Shell completion. `unstable-dynamic` is what gives us the `COMPLETE=<shell>`
# runtime engine (`CompleteEnv`), so completions are computed by the binary
# itself and can be *dynamic* — fleet names, board ids, ops — instead of a
# frozen generated script. It is still an unstable clap feature, hence the
# exact-version pin: a minor bump of clap_complete may change the shell code it
# emits and the argv protocol it speaks.
clap_complete = { version = "=4.6.3", features = ["unstable-dynamic"] }
toml = "0.8"
directories = "6"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# crypto (capability tokens)
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"

# JWT verification for GitHub Actions workload identity (architecture §6.7).
#
# `rust_crypto`, not `aws_lc_rs`, for the reason the http/tls blocks above give:
# the workspace is deliberately pure-Rust so the agent cross-compiles to
# armv7-musl. `default-features = false` also drops `use_pem` (and with it
# `pem` + `simple_asn1`): nothing here loads a PEM key — the coordinator builds
# its decoding keys from a JWKS, and the tests sign with a committed DER
# fixture through `EncodingKey::from_rsa_der`.
#
# Only forgs-idp's OFF-BY-DEFAULT `oidc` feature (enabled by the coordinator)
# pulls this in, so the Pi agent's graph is unchanged.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

# async traits (object-safe dyn impls)
async-trait = "0.1"

# gpio (Linux char-device line control; agent power control)
tokio-gpiod = "0.3"

# unix syscalls (advisory file locking + uid checks for the sidecar's lease
# store). Already in the lock file via `tempfile`; `default-features = false`
# keeps it to the same pure-Rust shape the rest of the tree insists on.
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }

# dev / test helpers
tempfile = "3"
