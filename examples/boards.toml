# probe-rs-fleet — boards.toml reference (agent-local board inventory)
#
# Maps physical probe serials to leasable boards for ONE agent. The agent
# reconciles discovered probes against these declarations. The default path is
# ~/.config/probe-rs-fleet/node/boards.toml; override it with `boards_path` in
# node.toml (see examples/node.toml).
#
# `probe-rs-fleet share` / `agent up` scaffold a commented version of this file.
#
# ---------------------------------------------------------------------------
# ANNOTATION AND OVERRIDE, not admission control (architecture §8)
# ---------------------------------------------------------------------------
#
# Revision 1 made every probe wait for a declaration here. That is right for a
# lab and pure friction for a laptop, so it is now this node's `adopt` policy
# (see examples/node.toml) that decides:
#
#   adopt = "auto"     — undeclared probes are adopted automatically, with a
#                        derived id and inferred tags. This file is then where
#                        you give one a STABLE id, a chip name, curated tags, or
#                        power wiring — none of which the agent can infer.
#   adopt = "declared" — only the boards below are leasable.
#
# An auto-adopted board has no `chip`: `probe-rs list` reports the probe, not
# the target attached to it. So `ctl lease --select 'chip=…'` will not match one
# until you set `chip` here. That is the trade, not a defect.

# Repeat one [[board]] table per board you want to declare or annotate.

[[board]]
# Stable board id, referenced by `ctl lease`.
#
# Unique WITHIN THIS NODE, not across the fleet: a board is identified
# fleet-wide by (org, node, id) — see architecture §6.1. Auto-adoption is
# exactly where a global id space breaks, since two laptops can each plug in an
# nRF52840-DK.
id        = "nrf52840-dk-3"

# Physical probe serial bound to this board. The agent locks each `probe-rs
# serve` to this serial via ProbeAccess::Allow([serial]) for isolation.
serial    = "001050257890"

# probe-rs target/chip name (informational; the client still selects in-band).
chip      = "nRF52840_xxAA"

# Free-form selection tags (matched by `ctl lease tag=<t>`).
tags      = ["nrf52", "bluetooth"]

# Whether the board admits only one lease at a time. Default: true.
exclusive = true

# USB power control for post-lease cleanup / fault recovery.
# kind = "uhubctl"  → per-port USB hub control (set `hub` + `port`)
# kind = "gpio"     → GPIO relay (set `chip` + `line`)
# kind = "none"     → no external power control
[board.power]
kind = "uhubctl"
hub  = "1-1"
port = 2

# A second board, GPIO-powered, exclusive by default:
#
# [[board]]
# id     = "stm32f4-disco-1"
# serial = "066BFF555654827167161721"
# chip   = "STM32F407VGTx"
# tags   = ["stm32", "cortex-m4"]
#
# [board.power]
# kind = "gpio"
# chip = "gpiochip0"
# line = 17
