# probefleet — boards.toml reference (agent-local board inventory)
#
# Maps physical probe serials to leasable boards for ONE agent. The agent
# reconciles discovered probes against these declarations. The default path is
# ~/.config/probefleet/node/boards.toml; override it with `boards_path` in
# node.toml (see examples/node.toml).
#
# `probefleet share` / `node up` scaffold a commented version of this file.
#
# ---------------------------------------------------------------------------
# You do not have to write this by hand
# ---------------------------------------------------------------------------
#
#   probefleet node board list          # declared vs. attached-but-undeclared
#   probefleet node board add           # pick a probe, prompt for id/chip/model
#   probefleet node board add --serial 001050047405 --id nrf52840-dk-1 \
#       --chip nRF52840_xxAA --model nrf52840dk --tag nrf52    # scriptable
#
# `add` **appends** a [[board]] table to this file and never rewrites the rest
# of it, so every comment you have written here survives. The flip side: it is
# the only verb — EDITING and REMOVING a declaration are still hand-edits.
#
# The agent reads this file once at startup, so restart it after any change.
#
# ---------------------------------------------------------------------------
# ANNOTATION AND OVERRIDE, not admission control (architecture §8)
# ---------------------------------------------------------------------------
#
# Making every probe wait for a declaration here is right for a lab and pure
# friction for a laptop, so this node's `adopt` policy (see examples/node.toml)
# decides:
#
#   adopt = "auto"     — undeclared probes are adopted automatically, with a
#                        derived id and inferred tags. This file is then where
#                        you give one a STABLE id, a chip name, a board model,
#                        curated tags, or power wiring — none of which the agent
#                        can infer.
#   adopt = "declared" — only the boards below are leasable.
#
# An auto-adopted board has no `chip` AND no `model`: `probe-rs list` reports
# the probe (a J-Link), not the target attached to it and not the board it is
# wired to. So neither `ctl lease chip=…` nor `ctl lease board=<model>` will
# match one until you set `chip` / `model` here. That is the trade, not a
# defect.

# Repeat one [[board]] table per board you want to declare or annotate.

[[board]]
# Stable board id, referenced by `ctl lease id=<name>`.
#
# Unique WITHIN THIS NODE, not across the fleet: a board is identified
# fleet-wide by (org, node, id) — see architecture §6.1. Auto-adoption is
# exactly where a global id space breaks, since two laptops can each plug in an
# nRF52840-DK.
id        = "nrf52840-dk-3"

# Physical probe serial bound to this board. The agent locks each `probe-rs
# serve` to this serial via ProbeAccess::Allow([serial]) for isolation.
serial    = "001050257890"

# probe-rs target/chip name (informational; the client still selects in-band).
# Matched by `ctl lease chip=<name>`.
chip      = "nRF52840_xxAA"

# Board MODEL (board type) — matched by `ctl lease board=<model>`, and the
# thing a grant is normally written against (`grant bob --select
# 'board=nrf52840dk'`).
#
# Three different things, easily confused:
#
#   chip  = the MCU        (`nRF52840_xxAA`) — a Nordic DK and a custom
#                            nRF52840 board share it and are NOT interchangeable
#   model = the board type (`nrf52840dk`)   — what a dev means by "I need an
#                            nrf52840dk": any board of this type will do
#   tags  = free-form convention (`lab`, `bluetooth`) — whatever you agree on
#
# The agent cannot infer the model, so declare it here. If this board genuinely
# has no model, omit the key entirely (do NOT write `model = ""`, which is
# rejected) — accepting that no `board=` selector will then match it.
model     = "nrf52840dk"

# Free-form selection tags (matched by `ctl lease tag=<t>`).
tags      = ["nrf52", "bluetooth"]

# Whether the board admits only one lease at a time. Default: true.
exclusive = true

# USB power control for post-lease cleanup / fault recovery.
# kind = "uhubctl"  → per-port USB hub control (set `hub` + `port`)
# kind = "gpio"     → GPIO relay (set `chip` + `line`)
# kind = "none"     → no external power control
[board.power]
kind = "uhubctl"
hub  = "1-1"
port = 2

# Serial passthrough (`probefleet ctl serial <board>`). USB serial ports that
# share the probe's USB device (J-Link VCOM, ST-Link VCP, DAPLink CDC-ACM) are
# discovered automatically and named `if<N>`; set `uart_discover = false` to
# turn that off. Add a UART on a separate adapter explicitly — prefer a stable
# /dev/serial/by-id path, ttyUSB numbers move:
#
# [[board.uart]]
# name = "console"                 # optional, default "uart<i>"
# path = "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A1B2C3-if00-port0"
# baud = 115200                    # optional default baud

# A second board, GPIO-powered, exclusive by default:
#
# [[board]]
# id     = "stm32f4-disco-1"
# serial = "066BFF555654827167161721"
# chip   = "STM32F407VGTx"
# model  = "stm32f4discovery"
# tags   = ["stm32", "cortex-m4"]
#
# [board.power]
# kind = "gpio"
# chip = "gpiochip0"
# line = 17
