# probefleet — node.toml reference (node-local, non-credential settings)
#
# Discovered at
#   $XDG_CONFIG_HOME/probefleet/node/node.toml
#   (i.e. ~/.config/probefleet/node/node.toml)
#
# `probefleet share` / `node up` scaffold a commented version of this file.
#
# ---------------------------------------------------------------------------
# Why this is NOT per fleet
# ---------------------------------------------------------------------------
#
# Everything here is a fact about THIS MACHINE — which probes are attached, how
# they are powered, how chatty its heartbeat is — and stays true whichever fleet
# it is enrolled in. Making it per-fleet would duplicate it for nothing and let
# the copies drift.
#
# The node's CREDENTIAL is the opposite: it is per-fleet by definition, and
# lives in the [node] table of ~/.config/probefleet/fleets/<name>.toml
# (0600). See examples/fleet.toml.
#
# There are no credentials in this file, so it is written world-readable.
#
# Every key below is optional; an absent file is equivalent to an empty one.

# What this node does with a probe `boards.toml` does not declare
# (architecture §4.2, §8). Default: "declared".
#
#   "auto"     — adopt it: derive a stable node-local id from the probe, infer
#                tags (the probe type, plus `auto`), and make it leasable.
#                `share` sets this, because someone deliberately offering their
#                machine wants a board they plug in to just work. The adopted
#                board has NO `chip` and NO `model`, because `probe-rs list`
#                reports the probe and neither the target attached to it nor
#                the board it is wired to — so neither `ctl lease chip=…` nor
#                `ctl lease board=<model>` will match it until boards.toml
#                annotates it.
#   "declared" — report it, but keep it unleasable until it is declared in
#                boards.toml. `node up --auth-key` sets this: CI and lab nodes
#                want stable ids and no surprises.
#
# ADVISORY. The coordinator's `node` row is what actually decides; this setting
# only governs whether this agent bothers to synthesise board metadata for
# undeclared probes at all. Editing it here does NOT change what the coordinator
# will adopt — re-run `probefleet share --adopt <policy>` (or `node up
# --adopt <policy>`) for that.
# adopt = "declared"

# How often (seconds) the agent re-enumerates locally attached probes.
# Default: 30.
#
# This is what makes "plug in a board and it becomes leasable" true; each pass
# shells out to `probe-rs list`, so it is cheap but not free. The agent reports
# a new inventory only when something actually changed, so a quiet node stays
# quiet whatever this is set to.
# discovery_secs = 30

# Path to this node's board inventory (see examples/boards.toml).
# Default: ~/.config/probefleet/node/boards.toml
# A leading `~/` in this value is expanded to your home directory; `~user` is
# not, and is left as a literal path component.
# boards_path = "/etc/probefleet/boards.toml"

# How often (seconds) the agent heartbeats to the coordinator. Default: 15.
#
# The heartbeat is also what keeps the persistent dial-out connection alive
# through a reverse proxy that reaps idle WebSockets, so raising it far is not
# free.
# heartbeat_secs = 15

# Erase the target's flash when a lease is released. Default: false.
#
# Off by default because it is destructive and slow, and a shared lab board is
# usually reflashed by the next lease anyway. Turn it on where one tenant's
# firmware must not be readable by the next.
# erase_on_release = false
