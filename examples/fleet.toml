# probefleet — fleets/<name>.toml reference (per-fleet configuration)
#
# ONE FILE PER FLEET, at
#   $XDG_CONFIG_HOME/probefleet/fleets/<name>.toml
#   (i.e. ~/.config/probefleet/fleets/<name>.toml)
#
# Select a fleet with `--fleet <name>` or PROBEFLEET; the default is
# `default`. `probefleet fleets` lists the ones this machine has.
#
# You do not normally write this file by hand. It is managed by:
#   probefleet login       → writes [user]
#   probefleet logout      → clears [user] and revokes it server-side
#                                (--all: every session/refresh token you hold)
#   probefleet share       → writes [node], using the login you already have
#   probefleet node up     → writes [node] (session, or --auth-key)
#   probefleet agent login → writes [agent] (a persistent sandbox session)
# All of them preserve the others' tables.
#
# ---------------------------------------------------------------------------
# THIS FILE HOLDS BEARER CREDENTIALS. It is written 0600.
# ---------------------------------------------------------------------------
#
# Anyone who can read [user].session_token can act as you until it expires.
# Anyone who can read [node].node_token can act as this node until the token
# rotates or the node's row is deleted on the coordinator.
#
# TWO of the fields are DURABLE: they do not merely act, they MINT.
#
#   [agent].auth_key      Anyone who can read it can keep minting fresh
#                         workload sessions as that machine identity until the
#                         key is revoked (`auth-key revoke`) or expires. That is
#                         why it is written by one verb whose documentation
#                         names the trust decision, and by nothing else.
#
#   [user].refresh_token  Anyone who can read it can keep minting session tokens
#                         AS YOU, for up to 30 days. It can do nothing else: it
#                         opens no connection (/agent, /client, /delegate and
#                         /api/v1 all refuse it) and it enrolls nothing. Revoke
#                         it with `probefleet logout --all`, which kills
#                         every session and refresh token you hold in the fleet,
#                         on every machine.
#
# Redeeming a refresh token does NOT consume it, deliberately: that is what lets
# several concurrent `probe-rs` invocations in one build each renew and each get
# a working session. The cost is that a leak is usable for its whole lifetime,
# bounded only by `logout --all` and the 30-day expiry.
#
# ---------------------------------------------------------------------------
# Why one file per fleet, and why the two tokens do NOT merge
# ---------------------------------------------------------------------------
#
# A laptop is routinely both a user and a node. The previous layout (one config
# tree per role, subdivided per profile) could not express that: it needed two
# unrelated enrollments, two identities, and two trees, with nothing tying them
# to the same fleet. Here it is one file with three optional tables:
#
#   laptop     → [user] AND [node]
#   headless Pi→ [node] only
#   CI runner  → neither (its token comes from the environment)
#   sandbox    → [agent] (a persistent machine identity; see below)
#
# The CI row is a rule, not an omission. `probefleet ci login` writes
# NOTHING here: it exchanges the job's workload identity for a token that lives
# in PROBEFLEET_COORDINATOR / PROBEFLEET_TOKEN for one job, and expires
# with it (architecture §6.7). Persisting a credential to disk on a shared
# runner is the one durable artefact the whole CI path exists to avoid, and the
# sidecar reads exactly those two variables, so nothing needs the file.
#
# `probefleet agent login` is the deliberate, opt-in exception to that rule,
# and only for the machine it is run on. A persistent single-tenant sandbox with
# concurrent users cannot re-run `ci login` hourly in every process, so it
# stores a durable auth key here and re-redeems it as the session nears expiry.
# The premise is that the operator OWNS that sandbox and is content to let it
# hold a persistent key in its filesystem reach — never true of a shared runner,
# which is why the two verbs stay separate rather than one growing a --persist
# flag.
#
# The two tokens stay DISTINCT CREDENTIALS. Merging them — "one identity per
# machine" — would make a compromised Pi, a device sitting on a shelf that
# anyone walking past can reach, equivalent to a compromised user account.
# The node token is machine-scoped and survives reboots; the session token is
# human-scoped and short-lived.


# ---------------------------------------------------------------------------
# Fleet-wide
# ---------------------------------------------------------------------------

# Base URL of this fleet's coordinator. A bare `host:port` is accepted and
# assumes https.
url = "https://fleet.example.com"

# Optional: pin the coordinator's server certificate by its SHA-256, for a
# self-hosted deployment with no publicly trusted certificate. Without it the
# coordinator is verified against the usual public web PKI roots.
#
# Read the fingerprint with:
#   openssl x509 -in cert.pem -outform der | openssl dgst -sha256
# server_cert_sha256 = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"


# ---------------------------------------------------------------------------
# [user] — written by `probefleet login`
# ---------------------------------------------------------------------------
#
# Read by `ctl` and by the `probe-rs` sidecar shim. Explicit flags and env vars
# (PROBEFLEET_COORDINATOR / PROBEFLEET_TOKEN) take precedence over it.

[user]
# Your bearer session token. Short-lived; `ctl` refreshes it as it nears expiry
# and writes the replacement back here.
session_token = "prfs1_…"

# Your fleet username, as the coordinator reported it at login. It is the
# fleet's own name for you, picked on first login — not a provider login — and
# it is also the name of your personal org.
username = "kaspar"

# Your immutable user id (a ULID), if the coordinator reported it.
# user_id = "01J9Z3K4M5N6P7Q8R9S0T1V2W3"

# The org `ctl`, `auth-key` and `share` act in, set by `login --org <name>`.
# Omitted means your personal org (named after the username). A session is
# not bound to one org: you act in any org you are a member of, and the
# coordinator checks that membership on every request.
# org = "acme"

# When the session token expires (epoch seconds), if known.
expires = 1788600000

# The refresh token that renews the session above, written by `login` if the
# coordinator issued one. OPTIONAL: a fleet file without it is valid — the
# session then simply stops at its expiry and you re-run `login`.
#
# With it, `ctl` and the `probe-rs` shim renew the session themselves, so a
# workstation that only ever runs builds does not hit a login cliff every 12
# hours. Redemption is non-rotating, so this value stays valid and concurrent
# processes do not race each other for it.
#
# What it can do: mint session tokens for you. That is the whole
# list. What revokes it: `probefleet logout --all`, or its own expiry.
refresh_token = "prfr1_…"


# ---------------------------------------------------------------------------
# [node] — written by `probefleet share` / `node up`, refreshed by the agent
# ---------------------------------------------------------------------------
#
# Present only if this machine offers probes to the fleet. Node-local settings
# that are NOT credentials (board inventory, heartbeat, power wiring) live in
# ~/.config/probefleet/node/ instead — they describe the machine, not the
# fleet, so they are not duplicated when it joins a second one.

[node]
# This node's bearer token. The coordinator rotates it over the established
# connection and the agent rewrites this table when it does — which is why every
# writer here is read-modify-write: a rotation must not clobber [user].
node_token = "prfn1_…"

# The node id the coordinator assigned at enrollment: `<org id>/<node name>`,
# where the org id is the org's immutable ULID, not its name. Advisory: the coordinator
# identifies this node by the token it presents and refuses the connection if
# this field contradicts it.
node_id = "01J9Z3K4M5N6P7Q8R9S0T1V2W3/rpi-lab-1"

# Hex-encoded ed25519 public key of the coordinator's capability-token signer,
# returned by enrollment. Used to verify the per-lease tokens the agent is
# handed, so a node cannot be told to serve a board it has no token for.
coordinator_token_pubkey = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# The token this one replaced, retained until a connection with `node_token`
# succeeds. This closes the one rotation window the ack-then-retire scheme
# cannot: if the ACK is lost after the node wrote the new token, the node holds
# the new one while the coordinator still holds the old. Retrying once with this
# recovers without server state — and without it, that case needs someone
# standing next to the Pi.
# previous_node_token = "prfn1_…"


# ---------------------------------------------------------------------------
# [agent] — written by `probefleet agent login`, refreshed by ctl / the shim
# ---------------------------------------------------------------------------
#
# Present only on a PERSISTENT SANDBOX: a long-running, single-tenant machine
# with concurrent processes that all want to reach the fleet — a dev container,
# a shared build box, an agent's workspace.
#
# Such a machine can hold a persistent *identity* without this table (mint the
# key with `auth-key create --purpose agent --as <name>`), but not a persistent
# *session*: the workload token it authenticates with lives about an hour and
# nothing renews it. Without this table every sandbox threads its own hourly
#   eval "$(probefleet ci login …)"
# which is a cron job reimplemented per sandbox, and which does not even
# propagate between the concurrent processes sharing the machine.
#
# Written by:
#   probefleet agent login --fleet-url <url> --auth-key prfk1_… --as <name>
#
# THE KEY MUST BE `--multi-use`. A single-use key breaks on the second PROCESS,
# not merely the second hour, so `agent login` refuses one — it detects this by
# redeeming twice, which costs a single-use key its one redemption.

[agent]
# The durable credential. Re-redeemed by `ctl` and the `probe-rs` shim whenever
# the workload token below is within 60s of expiry, so the session renews itself
# with no cron job and no wrapper.
#
# Re-redeeming a multi-use key is NOT a rotation: nothing is invalidated, each
# redemption mints an independent token and upserts the same grant row. That is
# why concurrent processes here need no locking, and why there is no
# `previous_workload_token` field to mirror [node]'s.
auth_key = "prfk1_…"

# The `--as` identity the key speaks as. DISPLAY ONLY, and not verified: the
# redemption response does not echo the subject name, so this is what the
# operator typed, not what the coordinator resolved.
name = "desk-bot"

# The current short-lived session, re-minted from the key above.
workload_token = "prfw1_…"

# When that token expires (epoch seconds). REQUIRED, unlike [user].expires: a
# self-renewing session must know when to renew without a round trip. Renewing
# on every invocation would be a permanent herd; never renewing defeats the
# point.
expires = 1788999999
